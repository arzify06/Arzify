<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Desire Luxe Interiors</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-logo">
                <h2>Desire Luxe Interiors</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="admin-dashboard.html" class="active">Dashboard</a></li>
                <li><a href="admin-users.html">Users</a></li>
                <li><a href="admin-products.html">Products</a></li>
                <li><a href="admin-orders.html">Orders</a></li>
                <li><a href="admin-contact.html">Contact Messages</a></li>
                <li><a href="admin-profile.html">Profile</a></li>
                <li><a href="index.html">View Website</a></li>
                <li><a href="#" onclick="adminLogout(); return false;">Logout</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <h1 style="color: var(--gold); margin-bottom: 30px;">Dashboard</h1>
            
            <!-- Dashboard Cards -->
            <div class="dashboard-cards">
                <div class="dashboard-card">
                    <h3>Total Users</h3>
                    <div class="number" id="totalUsers">0</div>
                </div>
                <div class="dashboard-card">
                    <h3>Total Products</h3>
                    <div class="number" id="totalProducts">0</div>
                </div>
                <div class="dashboard-card">
                    <h3>Total Orders</h3>
                    <div class="number" id="totalOrders">0</div>
                </div>
                <div class="dashboard-card">
                    <h3>Contact Messages</h3>
                    <div class="number" id="totalContacts">0</div>
                </div>
            </div>

            <!-- Recent Orders -->
            <div class="card">
                <h2 style="color: var(--gold); margin-bottom: 20px;">Recent Orders</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Product</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="recentOrdersTable">
                            <!-- Recent orders will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Load recent orders
            const orders = getAllOrders();
            const recentOrders = orders.slice(-5).reverse();
            const tbody = document.getElementById('recentOrdersTable');
            
            if (recentOrders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--gray-medium);">No orders yet</td></tr>';
            } else {
                recentOrders.forEach(order => {
                    const statusClass = order.status === 'delivered' ? 'status-delivered' : 'status-pending';
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${order.orderId}</td>
                        <td>${order.userName}</td>
                        <td>${order.productName}</td>
                        <td>$${order.total}</td>
                        <td><span class="status-badge ${statusClass}">${order.status}</span></td>
                        <td>${new Date(order.date).toLocaleDateString()}</td>
                    `;
                    tbody.appendChild(row);
                });
            }
        });
    </script>
</body>
</html>
