<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Admin Panel</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-logo">
                <h2>Desire Luxe Interiors</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="admin-users.html">Users</a></li>
                <li><a href="admin-products.html" class="active">Products</a></li>
                <li><a href="admin-orders.html">Orders</a></li>
                <li><a href="admin-contact.html">Contact Messages</a></li>
                <li><a href="admin-profile.html">Profile</a></li>
                <li><a href="index.html">View Website</a></li>
                <li><a href="#" onclick="adminLogout(); return false;">Logout</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <h1 style="color: var(--gold); margin-bottom: 30px;">Manage Products</h1>
            
            <!-- Add Product Form -->
            <div class="card">
                <h2 style="color: var(--gold); margin-bottom: 20px;">Add/Edit Product</h2>
                <div id="editModeIndicator" style="display: none; background: rgba(212, 175, 55, 0.2); padding: 10px; border-radius: 5px; margin-bottom: 20px; color: var(--gold);">
                    <strong>Edit Mode:</strong> Editing product. <button onclick="cancelEdit()" class="btn btn-secondary" style="padding: 5px 15px; margin-left: 10px;">Cancel</button>
                </div>
                <form id="productForm" onsubmit="addProduct(); return false;">
                    <div class="form-group">
                        <label for="productName">Product Name *</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label for="productCategory">Category *</label>
                        <select id="productCategory" required>
                            <option value="">Select Category</option>
                            <option value="Luxury">Luxury</option>
                            <option value="Modern">Modern</option>
                            <option value="Classic">Classic</option>
                            <option value="Premium">Premium</option>
                            <option value="Sport">Sport</option>
                            <option value="Custom">Custom</option>
                            <option value="LED">LED</option>
                            <option value="Executive">Executive</option>
                            <option value="Vintage">Vintage</option>
                            <option value="Luxury Plus">Luxury Plus</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="productSubcategory">Subcategory</label>
                        <input type="text" id="productSubcategory" placeholder="e.g., Diamond, Leather, LED">
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Price ($) *</label>
                        <input type="number" id="productPrice" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="productDescription">Description *</label>
                        <textarea id="productDescription" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="productImage">Image URL *</label>
                        <input type="url" id="productImage" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Add Product</button>
                </form>
            </div>

            <!-- Products Table -->
            <div class="card" style="margin-top: 30px;">
                <h2 style="color: var(--gold); margin-bottom: 20px;">All Products</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Subcategory</th>
                                <th>Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <!-- Products will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
