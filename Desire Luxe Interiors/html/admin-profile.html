<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile - Admin Panel</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-logo">
                <h2>Desire Luxe Interiors</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="admin-users.html">Users</a></li>
                <li><a href="admin-products.html">Products</a></li>
                <li><a href="admin-orders.html">Orders</a></li>
                <li><a href="admin-contact.html">Contact Messages</a></li>
                <li><a href="admin-profile.html" class="active">Profile</a></li>
                <li><a href="index.html">View Website</a></li>
                <li><a href="#" onclick="adminLogout(); return false;">Logout</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <h1 style="color: var(--gold); margin-bottom: 30px;">Admin Profile</h1>
            
            <div class="card">
                <div id="adminProfileInfo">
                    <!-- Admin profile info will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const admin = JSON.parse(localStorage.getItem('admin') || '{}');
            const profileInfo = document.getElementById('adminProfileInfo');
            
            profileInfo.innerHTML = `
                <h2>${admin.name || 'Admin User'}</h2>
                <p><strong>Username:</strong> ${admin.username}</p>
                <p><strong>Email:</strong> ${admin.email}</p>
            `;
        });
    </script>
</body>
</html>
