<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Bus / Speed Icon -->
  <g transform="translate(10, 10)">
    <!-- Aerodynamic Badge Circle -->
    <circle cx="50" cy="50" r="48" fill="url(#primaryGrad)" filter="url(#subtleShadow)"/>
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4,2"/>
    
    <!-- Modern Travel Bus Icon -->
    <g transform="translate(24, 28) scale(1.1)">
      <!-- Main Bus Body -->
      <path d="M4 12 C4 4, 8 2, 24 2 C40 2, 44 4, 44 12 L44 32 C44 34, 42 36, 40 36 L38 36 L38 40 C38 41.5, 36.5 42, 35 42 L33 42 C31.5 42, 31 41.5, 31 40 L31 36 L17 36 L17 40 C17 41.5, 15.5 42, 14 42 L12 42 C10.5 42, 10 41.5, 10 40 L10 36 L8 36 C5.5 36, 4 34, 4 32 Z" fill="#ffffff"/>
      <!-- Windshield -->
      <path d="M7 8 C7 5, 10 5, 24 5 C38 5, 41 5, 41 8 L41 17 L7 17 Z" fill="url(#primaryGrad)"/>
      <!-- Windows -->
      <rect x="7" y="20" width="9" height="6" rx="1.5" fill="url(#primaryGrad)"/>
      <rect x="19" y="20" width="9" height="6" rx="1.5" fill="url(#primaryGrad)"/>
      <rect x="31" y="20" width="9" height="6" rx="1.5" fill="url(#primaryGrad)"/>
      <!-- Headlights -->
      <circle cx="10" cy="30" r="2" fill="#f59e0b"/>
      <circle cx="38" cy="30" r="2" fill="#f59e0b"/>
      <!-- Grill / Bumper -->
      <line x1="17" y1="30" x2="31" y2="30" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Speed swooshes -->
    <path d="M96 35 C108 42, 108 58, 96 65" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M102 42 C110 47, 110 53, 102 58" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography: Desire Travel -->
  <g transform="translate(130, 42)">
    <text x="0" y="28" font-family="'Poppins', 'Segoe UI', Montserrat, sans-serif" font-size="38" font-weight="900" letter-spacing="1.5" fill="#1e3c72">
      DESIRE
    </text>
    <text x="145" y="28" font-family="'Poppins', 'Segoe UI', Montserrat, sans-serif" font-size="38" font-weight="800" letter-spacing="2" fill="#f59e0b">
      TRAVEL
    </text>
    
    <!-- Tagline & Badge -->
    <text x="2" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#64748b">
      LUXURY FLEET &amp; RESERVATIONS
    </text>

    <!-- Accent Line -->
    <rect x="0" y="60" width="340" height="3" rx="1.5" fill="url(#goldGrad)"/>
  </g>
</svg>
